name: release-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build exe
        run: python installer/build_exe.py
      - name: Smoke test (selfcheck, no window)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "cds-home"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          & dist/claude-dev-system-settings.exe --claude-home $tmp --selfcheck "$tmp/state.json"
          if ($LASTEXITCODE -ne 0) { throw "selfcheck failed" }
          Get-Content "$tmp/state.json"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-dev-system-settings
          path: dist/claude-dev-system-settings.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/claude-dev-system-settings.exe
          generate_release_notes: true
